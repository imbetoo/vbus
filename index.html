<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tus rutinas de Vitrasa con los tiempos de llegada de un vistazo." />
    <meta name="theme-color" content="#F8F6FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D2D44" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="vBus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>vBus</title>
    <!-- Aplica el tema antes del primer pintado para evitar un destello. -->
    <script>
      try {
        var theme = localStorage.getItem('vbus:theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        // Sin almacenamiento disponible: se queda en modo claro.
      }
    </script>
  </head>
  <!-- `ontouchstart` hace que iOS Safari aplique los estados :active. -->
  <body ontouchstart="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
