<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Icono maestro vectorial (public/icon.svg); los PNG salen de él con `npm run icons`. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tus rutinas de Vitrasa con los tiempos de llegada de un vistazo." />
    <meta name="theme-color" content="#F8F6FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D2D44" media="(prefers-color-scheme: dark)" />
    <!-- PWA (el manifest lo inyecta vite-plugin-pwa en el build). En iOS, a
         pantalla completa y con la barra de estado translúcida sobre la app
         (las safe areas ya dejan sitio al notch). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="vBus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>vBus</title>
    <!-- Aplica el tema, la paleta y el dinamismo antes del primer pintado
         para evitar un destello (misma regla que `src/lib/appearance.js`). -->
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem('vbus:theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var settings = JSON.parse(localStorage.getItem('vbus:settings') || '{}') || {};
        var palettes = { vigo: 0, nature: 0, sunset: 0, ocean: 0, cyberpunk: 'dark', lavender: 0, cloud: 'light', shadow: 'dark', oled: 'dark' };
        if (Object.prototype.hasOwnProperty.call(palettes, settings.palette)) {
          root.dataset.palette = settings.palette;
          theme = palettes[settings.palette] || theme;
        }
        if (['fluid', 'relaxed', 'static'].indexOf(settings.motion) >= 0) root.dataset.motion = settings.motion;
        root.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        // Sin almacenamiento disponible: se queda en modo claro.
      }
    </script>
  </head>
  <!-- `ontouchstart` hace que iOS Safari aplique los estados :active. -->
  <body ontouchstart="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
